<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bureau à distance</title>
<style>
  :root{
    --bg:#12161c; --panel:#1a2029; --line:#2a3240; --text:#e7edf5;
    --muted:#8592a3; --accent:#4fd6c4; --accent-dim:#2b5a54; --danger:#e0616b;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'SF Mono','Roboto Mono',Consolas,monospace; overscroll-behavior:none; }
  #app{ display:flex; flex-direction:column; height:100dvh; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--panel); gap:10px; }
  header .title{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  header .status{ font-size:11px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--danger); flex-shrink:0;}
  .dot.on{background:var(--accent);}
  #dataUsage{ color:var(--muted); } #dataUsage b{ color:var(--text); }

  #connectPanel{ padding:16px; display:flex; flex-direction:column; gap:10px; max-width:420px; margin:auto; overflow-y:auto; }
  #connectPanel h1{font-size:16px; margin:0 0 4px 0;}
  #connectPanel p{font-size:12px; color:var(--muted); margin:0 0 8px 0; line-height:1.5;}
  input[type=text], input[type=password]{
    background:#0e1218; border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:inherit; font-size:14px; outline:none; }
  input:focus{border-color:var(--accent);}
  button{ font-family:inherit; font-size:13px; letter-spacing:.03em; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); padding:10px 14px; cursor:pointer; }
  button.primary{background:var(--accent-dim); border-color:var(--accent); color:#eafffb;}
  button.active{background:var(--accent-dim); border-color:var(--accent);}
  button:active{transform:scale(0.97);}

  .qualityGroup{ display:flex; flex-direction:column; gap:6px; }
  .qualityGroup label.groupLabel{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .qualityOptions{ display:flex; gap:6px; }
  .qOpt{ flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 6px; text-align:center; cursor:pointer; background:#0e1218; }
  .qOpt.selected{ border-color:var(--accent); background:var(--accent-dim); }
  .qOpt .name{ font-size:12px; font-weight:bold; }
  .qOpt .est{ font-size:10px; color:var(--muted); display:block; margin-top:2px; }
  .qOpt.selected .est{ color:#cdeee9; }

  #screenWrap{ flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:#000; touch-action:none; }
  #screenImg{ max-width:100%; max-height:100%; display:block; -webkit-user-select:none; user-select:none; }

  #toolbar{ display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--panel); overflow-x:auto; align-items:center; }
  #toolbar button{white-space:nowrap;}
  #qualitySelect, #modeSelect{ background:#0e1218; color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:9px 8px; font-family:inherit; font-size:12px; }

  #hiddenInput{ position:absolute; opacity:0; height:0; width:0; pointer-events:none; }
  .hidden{display:none !important;}

  /* ─── Overlay mode jeu ─── */
  #gameOverlay{ position:absolute; inset:0; pointer-events:none; }
  #gameOverlay > *{ pointer-events:auto; }

  #joystickZone{ position:absolute; left:18px; bottom:18px; width:120px; height:120px; }
  #joyBase{ position:absolute; inset:0; border-radius:50%; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25); touch-action:none; }
  #joyKnob{ position:absolute; width:52px; height:52px; left:34px; top:34px; border-radius:50%;
    background:rgba(79,214,196,0.85); border:1px solid #cdeee9; transition:transform .12s ease; }

  #stanceButtons{ position:absolute; left:18px; bottom:150px; display:flex; flex-direction:column; gap:8px; }
  #stanceButtons button{ width:90px; padding:9px 6px; font-size:11px; background:rgba(26,32,41,0.85); }
  #stanceButtons button.active{ background:var(--accent-dim); border-color:var(--accent); }

  #rightControls{ position:absolute; right:18px; bottom:18px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  #rightControls button{ background:rgba(26,32,41,0.85); min-width:78px; }
  #rightControls button.active{ background:var(--accent-dim); border-color:var(--accent); }
  #clickButtons{ display:flex; gap:8px; }
  #clickButtons button{ min-width:60px; }

  #lookLayer{ position:absolute; inset:0; touch-action:none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="title">Bureau à distance</div>
    <div class="status">
      <span id="dataUsage" class="hidden"></span>
      <span class="dot" id="statusDot"></span>
      <span id="statusText">déconnecté</span>
    </div>
  </header>

  <div id="connectPanel">
    <h1>Se connecter au PC</h1>
    <p>Lance <code>server.py</code> sur ton PC, démarre ton tunnel, puis colle ici l'adresse WebSocket (<code>wss://xxxx.trycloudflare.com</code>) et le mot de passe.</p>
    <input type="text" id="urlInput" placeholder="wss://xxxx.trycloudflare.com" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input type="password" id="tokenInput" placeholder="Mot de passe (TOKEN)" autocomplete="off">

    <div class="qualityGroup">
      <label class="groupLabel">Qualité de l'image</label>
      <div class="qualityOptions" id="qualityOptionsConnect">
        <div class="qOpt" data-preset="eco"><div class="name">Économique</div><span class="est">~60-150 Mo/h</span></div>
        <div class="qOpt selected" data-preset="normal"><div class="name">Normal</div><span class="est">~400-800 Mo/h</span></div>
        <div class="qOpt" data-preset="high"><div class="name">Qualité</div><span class="est">~1-2 Go/h</span></div>
      </div>
    </div>

    <button class="primary" id="connectBtn">Se connecter</button>
  </div>

  <div id="screenWrap" class="hidden">
    <img id="screenImg" draggable="false">

    <div id="gameOverlay" class="hidden">
      <div id="lookLayer"></div>

      <div id="stanceButtons">
        <button id="sneakBtn">Sneak (Ctrl)</button>
        <button id="runBtn">Courir (Shift)</button>
      </div>

      <div id="joystickZone">
        <div id="joyBase"><div id="joyKnob"></div></div>
      </div>

      <div id="rightControls">
        <div id="clickButtons" class="hidden">
          <button id="clickLeftBtn">Clic G</button>
          <button id="clickRightBtn">Clic D</button>
        </div>
        <button id="mouseModeBtn">🖱 Souris</button>
        <button id="jumpBtn">Espace</button>
        <button id="interactBtn">E</button>
      </div>
    </div>
  </div>

  <div id="toolbar" class="hidden">
    <select id="modeSelect">
      <option value="normal" selected>Normal</option>
      <option value="game">Jeu</option>
    </select>
    <select id="qualitySelect">
      <option value="eco">Éco</option>
      <option value="normal" selected>Normal</option>
      <option value="high">Qualité</option>
    </select>
    <button id="keyboardBtn">⌨ Clavier</button>
    <button id="rightClickBtn">Clic droit</button>
    <button id="escBtn">Échap</button>
    <button id="enterBtn">Entrée</button>
    <button id="tabBtn">Tab</button>
    <button id="disconnectBtn">Déconnecter</button>
  </div>

  <input type="text" id="hiddenInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const connectPanel = $('connectPanel');
  const screenWrap = $('screenWrap');
  const screenImg = $('screenImg');
  const toolbar = $('toolbar');
  const statusDot = $('statusDot');
  const statusText = $('statusText');
  const hiddenInput = $('hiddenInput');
  const dataUsageEl = $('dataUsage');
  const qualitySelect = $('qualitySelect');
  const modeSelect = $('modeSelect');
  const gameOverlay = $('gameOverlay');

  let ws = null;
  let currentBlobUrl = null;
  let lastTapTime = 0;
  let selectedPreset = 'normal';

  // ─── Qualité (écran de connexion) ───
  document.querySelectorAll('#qualityOptionsConnect .qOpt').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('#qualityOptionsConnect .qOpt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedPreset = el.dataset.preset;
    });
  });

  // ─── Compteur de données ───
  let totalBytes = 0, sessionStart = null, lastUpdate = 0;
  function updateDataUsage() {
    const now = Date.now();
    if (now - lastUpdate < 1000) return;
    lastUpdate = now;
    const elapsedH = Math.max(0.0003, (now - sessionStart) / 3600000);
    const mbTotal = totalBytes / (1024 * 1024);
    dataUsageEl.innerHTML = `<b>${mbTotal.toFixed(1)} Mo</b> reçus · ~<b>${(mbTotal/elapsedH).toFixed(0)} Mo/h</b>`;
    dataUsageEl.classList.remove('hidden');
  }

  function setStatus(connected, text) {
    statusDot.classList.toggle('on', connected);
    statusText.textContent = text;
  }

  function connect() {
    const url = $('urlInput').value.trim();
    const token = $('tokenInput').value;
    if (!url) { alert("Indique l'adresse WebSocket de ton PC."); return; }

    setStatus(false, 'connexion...');
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token, preset: selectedPreset }));

    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'info') onConnected(msg.preset);
        return;
      }
      totalBytes += ev.data.byteLength;
      updateDataUsage();
      const blob = new Blob([ev.data], { type: 'image/jpeg' });
      const url2 = URL.createObjectURL(blob);
      const old = currentBlobUrl;
      screenImg.src = url2;
      currentBlobUrl = url2;
      if (old) URL.revokeObjectURL(old);
    };

    ws.onclose = () => {
      setStatus(false, 'déconnecté');
      screenWrap.classList.add('hidden');
      toolbar.classList.add('hidden');
      connectPanel.classList.remove('hidden');
      dataUsageEl.classList.add('hidden');
      resetGameState();
    };
    ws.onerror = () => setStatus(false, 'erreur de connexion');
  }

  function onConnected(preset) {
    setStatus(true, 'connecté');
    connectPanel.classList.add('hidden');
    screenWrap.classList.remove('hidden');
    toolbar.classList.remove('hidden');
    totalBytes = 0; sessionStart = Date.now(); lastUpdate = 0;
    if (preset) qualitySelect.value = preset;
  }

  function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  qualitySelect.addEventListener('change', () => send({ type: 'quality', preset: qualitySelect.value }));

  function imgToRatio(clientX, clientY) {
    const rect = screenImg.getBoundingClientRect();
    const nx = (clientX - rect.left) / rect.width;
    const ny = (clientY - rect.top) / rect.height;
    return { x: Math.min(1, Math.max(0, nx)), y: Math.min(1, Math.max(0, ny)) };
  }

  // ─── Clic normal (mode Normal, désactivé quand mode Souris actif en mode Jeu) ───
  let tapClickEnabled = true;
  screenImg.addEventListener('click', (e) => {
    if (!tapClickEnabled) return;
    const { x, y } = imgToRatio(e.clientX, e.clientY);
    const now = Date.now();
    if (now - lastTapTime < 320) send({ type: 'dblclick', x, y });
    else send({ type: 'click', x, y, button: 'left' });
    lastTapTime = now;
  });

  $('rightClickBtn').addEventListener('click', () => {
    alert("Touche l'écran là où tu veux faire le clic droit.");
    const handler = (e) => {
      const { x, y } = imgToRatio(e.clientX, e.clientY);
      send({ type: 'click', x, y, button: 'right' });
      screenImg.removeEventListener('click', handler, true);
    };
    screenImg.addEventListener('click', handler, true);
  });

  // ─── Clavier mobile ───
  $('keyboardBtn').addEventListener('click', () => { hiddenInput.value = ''; hiddenInput.focus(); });
  hiddenInput.addEventListener('input', (e) => {
    const it = e.inputType || '';
    if (it === 'deleteContentBackward') send({ type: 'key', key: 'Backspace' });
    else if (hiddenInput.value) send({ type: 'text', value: hiddenInput.value });
    hiddenInput.value = '';
  });
  hiddenInput.addEventListener('keydown', (e) => {
    if (['Enter','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      send({ type: 'key', key: e.key });
    }
  });
  $('enterBtn').addEventListener('click', () => send({ type: 'key', key: 'Enter' }));
  $('escBtn').addEventListener('click', () => send({ type: 'key', key: 'Escape' }));
  $('tabBtn').addEventListener('click', () => send({ type: 'key', key: 'Tab' }));
  $('disconnectBtn').addEventListener('click', () => { if (ws) ws.close(); });
  $('connectBtn').addEventListener('click', connect);

  // ─────────────────────────────────────────────
  // MODE JEU
  // ─────────────────────────────────────────────
  modeSelect.addEventListener('change', () => {
    const isGame = modeSelect.value === 'game';
    gameOverlay.classList.toggle('hidden', !isGame);
    // en mode jeu on garde le tap-click actif pour les menus, sauf si mode souris activé
    tapClickEnabled = !isGame || !mouseModeActive;
  });

  // ── Joystick 8 directions avec retour au centre ──
  const joyBase = $('joyBase'), joyKnob = $('joyKnob');
  let joyActive = false, joyId = null;
  let heldMoveKeys = new Set();
  const OCTANTS = [['d'], ['s','d'], ['s'], ['s','q'], ['q'], ['z','q'], ['z'], ['z','d']]; // E,SE,S,SW,W,NW,N,NE
  const MAX_R = 34, DEADZONE = 14;

  function applyMoveKeys(newKeysArr) {
    const newKeys = new Set(newKeysArr);
    for (const k of heldMoveKeys) if (!newKeys.has(k)) send({ type: 'keyup', key: k });
    for (const k of newKeys) if (!heldMoveKeys.has(k)) send({ type: 'keydown', key: k });
    heldMoveKeys = newKeys;
  }

  function handleJoyMove(clientX, clientY) {
    const rect = joyBase.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = clientX - cx, dy = clientY - cy;
    const dist = Math.min(Math.hypot(dx, dy), MAX_R);
    const angleRad = Math.atan2(dy, dx);
    const clampedX = Math.cos(angleRad) * dist, clampedY = Math.sin(angleRad) * dist;
    joyKnob.style.transition = 'none';
    joyKnob.style.transform = `translate(${clampedX}px, ${clampedY}px)`;

    if (Math.hypot(dx, dy) < DEADZONE) { applyMoveKeys([]); return; }
    let angleDeg = angleRad * 180 / Math.PI;
    let idx = Math.round(angleDeg / 45);
    idx = ((idx % 8) + 8) % 8;
    applyMoveKeys(OCTANTS[idx]);
  }

  function resetJoystick() {
    joyKnob.style.transition = 'transform .12s ease';
    joyKnob.style.transform = 'translate(0px, 0px)';
    applyMoveKeys([]);
    joyActive = false; joyId = null;
  }

  joyBase.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    handleJoyMove(t.clientX, t.clientY);
  }, { passive: false });
  joyBase.addEventListener('touchmove', (e) => {
    if (!joyActive) return;
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joyId) handleJoyMove(t.clientX, t.clientY);
  }, { passive: false });
  joyBase.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) if (t.identifier === joyId) resetJoystick();
  });
  // fallback souris (test sur ordinateur)
  joyBase.addEventListener('mousedown', (e) => { joyActive = true; handleJoyMove(e.clientX, e.clientY); });
  window.addEventListener('mousemove', (e) => { if (joyActive) handleJoyMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (joyActive) resetJoystick(); });

  // ── Sneak / Courir (bascule) ──
  let sneakActive = false, runActive = false;
  $('sneakBtn').addEventListener('click', () => {
    sneakActive = !sneakActive;
    $('sneakBtn').classList.toggle('active', sneakActive);
    send({ type: sneakActive ? 'keydown' : 'keyup', key: 'ctrl' });
  });
  $('runBtn').addEventListener('click', () => {
    runActive = !runActive;
    $('runBtn').classList.toggle('active', runActive);
    send({ type: runActive ? 'keydown' : 'keyup', key: 'shift' });
  });

  // ── Espace / E (maintien) ──
  function bindHold(btn, key) {
    const down = (e) => { e.preventDefault(); send({ type: 'keydown', key }); };
    const up = (e) => { e.preventDefault(); send({ type: 'keyup', key }); };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up);
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
  }
  bindHold($('jumpBtn'), 'space');
  bindHold($('interactBtn'), 'e');

  // ── Mode Souris (trackpad tactile + clic G/D) ──
  let mouseModeActive = false;
  const lookLayer = $('lookLayer');
  const clickButtons = $('clickButtons');
  let lookId = null, lastLookX = 0, lastLookY = 0;

  $('mouseModeBtn').addEventListener('click', () => {
    mouseModeActive = !mouseModeActive;
    $('mouseModeBtn').classList.toggle('active', mouseModeActive);
    clickButtons.classList.toggle('hidden', !mouseModeActive);
    tapClickEnabled = !mouseModeActive;
  });

  lookLayer.addEventListener('touchstart', (e) => {
    if (!mouseModeActive) return;
    const t = e.changedTouches[0];
    lookId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY;
  }, { passive: true });
  lookLayer.addEventListener('touchmove', (e) => {
    if (!mouseModeActive) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== lookId) continue;
      const dx = t.clientX - lastLookX, dy = t.clientY - lastLookY;
      lastLookX = t.clientX; lastLookY = t.clientY;
      send({ type: 'mousemove_rel', dx, dy });
    }
  }, { passive: true });
  lookLayer.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
  });

  $('clickLeftBtn').addEventListener('click', () => send({ type: 'click_here', button: 'left' }));
  $('clickRightBtn').addEventListener('click', () => send({ type: 'click_here', button: 'right' }));

  function resetGameState() {
    heldMoveKeys.clear(); sneakActive = false; runActive = false; mouseModeActive = false;
    $('sneakBtn').classList.remove('active'); $('runBtn').classList.remove('active');
    $('mouseModeBtn').classList.remove('active'); clickButtons.classList.add('hidden');
    resetJoystick();
    modeSelect.value = 'normal'; gameOverlay.classList.add('hidden'); tapClickEnabled = true;
  }
})();
</script>
</body>
</html>
